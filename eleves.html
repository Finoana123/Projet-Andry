<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Élèves</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .container { width: 100%; max-width: 1100px; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
    }
    .btn-back {
      background: white; border: 1px solid #e2e8f0; padding: 10px 16px;
      border-radius: 12px; font-weight: 500; color: #475569; cursor: pointer;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .btn-back:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-add {
      background: #4f46e5; color: white; border: none; padding: 12px 24px;
      border-radius: 14px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn-add:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4); }
    .card {
      background: white; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      overflow: hidden; padding: 0 0 24px 0;
    }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th {
      background: #f8fafc; font-weight: 600; color: #475569; padding: 16px 24px;
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    td { padding: 16px 24px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tbody tr { cursor: pointer; transition: background 0.15s; }
    tbody tr:hover { background: #f8fafc; }
    .badge {
      background: #e0e7ff; color: #4338ca; padding: 4px 12px; border-radius: 20px;
      font-weight: 600; font-size: 0.8rem; display: inline-block;
    }
    .empty-row td { text-align: center; padding: 48px; color: #94a3b8; }
    .msg { margin: 16px 24px 0 24px; padding: 12px 20px; border-radius: 12px; font-weight: 500; }
    .msg-success { background: #dcfce7; color: #166534; }
    .msg-error { background: #fee2e2; color: #991b1b; }

    /* Modales */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000;
      justify-content: center; align-items: center; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-dialog {
      background: white; border-radius: 24px; padding: 32px; width: 100%;
      max-width: 520px; position: relative; animation: slideUp 0.25s ease;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3); max-height: 85vh; overflow-y: auto;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-close {
      position: absolute; top: 16px; right: 20px; font-size: 28px;
      background: none; border: none; color: #94a3b8; cursor: pointer;
    }
    .modal-close:hover { color: #0f172a; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0;
      border-radius: 12px; font-size: 1rem; transition: 0.2s; outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    .btn-primary {
      background: #4f46e5; color: white; border: none; padding: 14px 24px;
      border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer;
      width: 100%; transition: 0.2s;
    }
    .btn-primary:hover { background: #4338ca; }
    .detail-actions {
      display: flex; gap: 12px; margin: 20px 0 10px; flex-wrap: wrap;
    }
    .btn-secondary {
      background: #f1f5f9; border: 1px solid #e2e8f0; padding: 12px 20px;
      border-radius: 12px; font-weight: 600; color: #334155; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger {
      background: #fee2e2; border: 1px solid #fecaca; color: #b91c1c;
      padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-danger:hover { background: #fecaca; }
    .qr-container { text-align: center; margin-top: 16px; }
    .qr-container img { max-width: 180px; border-radius: 12px; }
    .btn-print {
      margin-top: 12px; background: #0f172a; color: white; border: none;
      padding: 10px 20px; border-radius: 10px; font-weight: 500; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="btn-back" onclick="window.location.href='/dashboard.html'">← Retour</button>
      <button class="btn-add" id="openAddModalBtn">+ Ajouter un élève</button>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table id="studentsTable">
          <thead>
            <tr><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Niveau</th><th>Inscrit le</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="studentsMsg" class="msg" style="display:none;"></div>
    </div>
  </div>

  <!-- Modale Ajout -->
  <div id="addModal" class="modal">
    <div class="modal-dialog">
      <button class="modal-close" id="closeAddModal">&times;</button>
      <h2 style="margin-bottom:24px;">Nouvel élève</h2>
      <form id="addStudentForm">
        <div class="form-group"><label>Prénom</label><input type="text" id="firstName" required></div>
        <div class="form-group"><label>Nom</label><input type="text" id="lastName" required></div>
        <div class="form-group"><label>Matricule</label><input type="text" id="matricule" required></div>
        <div class="form-group">
          <label>Niveau</label>
          <select id="niveau" required>
            <option value="">Sélectionner</option>
            <option value="6ème">6ème</option><option value="5ème">5ème</option><option value="4ème">4ème</option>
            <option value="3ème">3ème</option><option value="2nde">2nde</option><option value="1ère">1ère</option>
            <option value="Terminale">Terminale</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Enregistrer</button>
      </form>
    </div>
  </div>

  <!-- Modale Détail -->
  <div id="detailModal" class="modal">
    <div class="modal-dialog">
      <button class="modal-close" id="closeDetailModal">&times;</button>
      <h2 id="detailName" style="margin-bottom:4px;"></h2>
      <p style="color:#64748b; margin-bottom:20px;" id="detailInfo"></p>
      <div class="detail-actions">
        <button class="btn-secondary" id="showHistoryBtn">📋 Historique</button>
        <button class="btn-secondary" id="generateQRBtn">📱 QR Code</button>
        <button class="btn-secondary" id="editStudentBtn">✏️ Modifier</button>
        <button class="btn-danger" id="deleteStudentBtn">🗑️ Supprimer</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = '/index.html';

    let currentQRURL = null;

    async function apiCall(url, method = 'GET', body = null) {
      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('adminToken');
          window.location.href = '/index.html';
        }
        throw new Error(data.message || 'Erreur');
      }
      return data;
    }

    // Charger la liste
    async function loadStudents() {
      const tbody = document.querySelector('#studentsTable tbody');
      const msgDiv = document.getElementById('studentsMsg');
      try {
        const students = await apiCall('/api/students');
        tbody.innerHTML = '';
        msgDiv.style.display = 'none';
        if (students.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Aucun élève pour le moment.</td></tr>`;
          return;
        }
        students.forEach(s => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${s.matricule}</strong></td>
            <td>${s.last_name}</td>
            <td>${s.first_name}</td>
            <td><span class="badge">${s.niveau || '-'}</span></td>
            <td>${s.created_at ? new Date(s.created_at).toLocaleDateString('fr-FR') : '-'}</td>
          `;
          row.addEventListener('click', () => openDetail(s));
          tbody.appendChild(row);
        });
      } catch (err) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'msg msg-error';
        msgDiv.textContent = 'Erreur : ' + err.message;
      }
    }
    loadStudents();

    // Modale Ajout
    const addModal = document.getElementById('addModal');
    document.getElementById('openAddModalBtn').addEventListener('click', () => addModal.classList.add('active'));
    document.getElementById('closeAddModal').addEventListener('click', () => addModal.classList.remove('active'));
    window.addEventListener('click', (e) => { if (e.target === addModal) addModal.classList.remove('active'); });

    document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const first_name = document.getElementById('firstName').value.trim();
      const last_name = document.getElementById('lastName').value.trim();
      const matricule = document.getElementById('matricule').value.trim();
      const niveau = document.getElementById('niveau').value;
      const msgDiv = document.getElementById('studentsMsg');
      if (!first_name || !last_name || !matricule || !niveau) {
        msgDiv.style.display = 'block'; msgDiv.className = 'msg msg-error';
        msgDiv.textContent = 'Tous les champs sont obligatoires.'; return;
      }
      try {
        await apiCall('/api/students', 'POST', { first_name, last_name, matricule, niveau });
        document.getElementById('addStudentForm').reset();
        addModal.classList.remove('active');
        msgDiv.style.display = 'block'; msgDiv.className = 'msg msg-success';
        msgDiv.textContent = 'Élève ajouté avec succès.';
        await loadStudents();
        setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
      } catch (err) {
        msgDiv.style.display = 'block'; msgDiv.className = 'msg msg-error';
        msgDiv.textContent = err.message;
      }
    });

    // Modale Détail
    const detailModal = document.getElementById('detailModal');
    let currentStudent = null;

    function openDetail(student) {
      currentStudent = student;
      document.getElementById('detailName').textContent = `${student.first_name} ${student.last_name}`;
      document.getElementById('detailInfo').textContent = `Matricule : ${student.matricule}  •  Niveau : ${student.niveau || '-'}`;
      document.getElementById('detailContent').innerHTML = '';
      detailModal.classList.add('active');
    }

    document.getElementById('closeDetailModal').addEventListener('click', () => detailModal.classList.remove('active'));
    window.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('active'); });

    // Historique
    document.getElementById('showHistoryBtn').addEventListener('click', async () => {
      if (!currentStudent) return;
      const content = document.getElementById('detailContent');
      content.innerHTML = '<p style="color:#64748b;">Chargement...</p>';
      try {
        const history = await apiCall(`/api/student-payments?student_id=${currentStudent.id}`);
        if (history.length === 0) {
          content.innerHTML = '<p style="color:#64748b;">Aucun paiement trouvé.</p>';
          return;
        }
        let html = '<table style="width:100%;margin-top:12px;"><thead><tr><th>Mois</th><th>Montant</th><th>Payé le</th></tr></thead><tbody>';
        history.forEach(p => {
          html += `<tr><td>${p.month}</td><td>${p.amount ? p.amount + ' Ar' : '-'}</td><td>${p.payment_date ? new Date(p.payment_date).toLocaleDateString('fr-FR') : '-'}</td></tr>`;
        });
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<p style="color:#b91c1c;">Erreur : ${err.message}</p>`;
      }
    });

    // QR Code + Imprimer
    document.getElementById('generateQRBtn').addEventListener('click', () => {
      if (!currentStudent) return;
      const content = document.getElementById('detailContent');
      const qrData = JSON.stringify({
        matricule: currentStudent.matricule,
        nom: currentStudent.last_name,
        prenom: currentStudent.first_name,
        niveau: currentStudent.niveau
      });
      const qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
      currentQRURL = qrURL;
      content.innerHTML = `
        <div class="qr-container">
          <img src="${qrURL}" alt="QR Code élève">
          <p style="margin-top:12px; color:#475569;">Scannez pour voir l'identité</p>
          <button class="btn-print" onclick="printStudentInfo()">🖨️ Imprimer / Exporter Word</button>
        </div>
      `;
    });

    // Fonction d'impression (export avec QR)
    window.printStudentInfo = function() {
      if (!currentStudent) return;
      const qrImage = currentQRURL ? `<img src="${currentQRURL}" style="max-width:200px; margin:20px 0;" />` : '';
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>Fiche élève - ${currentStudent.first_name} ${currentStudent.last_name}</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 40px; }
              h1 { color: #1e293b; }
              .info { margin: 20px 0; }
              .info p { font-size: 16px; }
              @media print { body { padding: 0; } }
            </style>
          </head>
          <body>
            <h1>Fiche élève</h1>
            <div class="info">
              <p><strong>Matricule :</strong> ${currentStudent.matricule}</p>
              <p><strong>Nom :</strong> ${currentStudent.last_name}</p>
              <p><strong>Prénom :</strong> ${currentStudent.first_name}</p>
              <p><strong>Niveau :</strong> ${currentStudent.niveau || '-'}</p>
            </div>
            ${qrImage}
            <p style="margin-top:16px;"><em>Scannez le QR code pour vérifier l'identité.</em></p>
            <p><em>Document généré depuis l'application école.</em></p>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    };

    // Modifier
    document.getElementById('editStudentBtn').addEventListener('click', async () => {
      if (!currentStudent) return;
      const newFirst = prompt('Nouveau prénom :', currentStudent.first_name);
      if (newFirst === null) return;
      const newLast = prompt('Nouveau nom :', currentStudent.last_name);
      if (newLast === null) return;
      const newMatricule = prompt('Nouveau matricule :', currentStudent.matricule);
      if (newMatricule === null) return;
      const newNiveau = prompt('Nouveau niveau :', currentStudent.niveau || '');
      if (newNiveau === null) return;
      try {
        await apiCall(`/api/students`, 'PUT', {
          id: currentStudent.id,
          first_name: newFirst.trim(),
          last_name: newLast.trim(),
          matricule: newMatricule.trim(),
          niveau: newNiveau.trim()
        });
        detailModal.classList.remove('active');
        await loadStudents();
      } catch (err) {
        alert('Erreur modification : ' + err.message);
      }
    });

    // Supprimer
    document.getElementById('deleteStudentBtn').addEventListener('click', async () => {
      if (!currentStudent) return;
      if (!confirm(`Supprimer définitivement ${currentStudent.first_name} ${currentStudent.last_name} ?`)) return;
      try {
        await apiCall(`/api/students`, 'DELETE', { id: currentStudent.id });
        detailModal.classList.remove('active');
        await loadStudents();
      } catch (err) {
        alert('Erreur suppression : ' + err.message);
      }
    });
  </script>
</body>
</html>
