<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des élèves - Administration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* En-tête */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .header-left h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-left h1 span {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #e2e8f0;
    }
    .btn-return {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-return:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
    }

    /* Carte principale */
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      padding: 32px 28px;
      overflow: hidden;
    }

    /* Barre d'actions */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .actions-bar h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #0f172a;
    }
    .btn-add {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }
    .btn-add:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.4);
    }

    /* Table */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
      padding: 16px 20px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: left;
    }
    td {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }
    tbody tr {
      cursor: pointer;
      transition: background 0.2s;
    }
    tbody tr:hover {
      background: #f1f5ff;
    }
    .badge-level {
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: #64748b;
    }

    /* Messages */
    .msg {
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 500;
    }
    .msg-success { background: #dcfce7; color: #166534; }
    .msg-error { background: #fee2e2; color: #991b1b; }
    .msg-info { background: #dbeafe; color: #1e3a8a; }

    /* Modales */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.active { display: flex; }

    .modal-dialog {
      background: white;
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      position: relative;
      animation: slideUp 0.3s ease;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 20px;
      font-size: 28px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close:hover { color: #0f172a; }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: 0.2s;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #4338ca;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      margin: 24px 0 12px;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    .qr-container {
      text-align: center;
      margin-top: 20px;
    }
    .qr-container img {
      max-width: 200px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- En-tête -->
    <div class="header">
      <div class="header-left">
        <h1>🎓 Gestion des élèves <span>Administration</span></h1>
      </div>
      <button class="btn-return" onclick="window.location.href='/dashboard.html'">
        ⬅ Retour au tableau de bord
      </button>
    </div>

    <!-- Carte -->
    <div class="card">
      <div class="actions-bar">
        <h2>Liste des élèves inscrits</h2>
        <button class="btn-add" id="openAddModalBtn">➕ Ajouter un élève</button>
      </div>

      <div class="table-wrapper">
        <table id="studentsTable">
          <thead>
            <tr>
              <th>Matricule</th>
              <th>Nom</th>
              <th>Prénom</th>
              <th>Niveau</th>
              <th>Inscrit le</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="studentsMsg" class="msg" style="display:none;"></div>
    </div>
  </div>

  <!-- Modale Ajout -->
  <div id="addModal" class="modal">
    <div class="modal-dialog">
      <button class="modal-close" id="closeAddModal">&times;</button>
      <h2 style="margin-bottom:24px;">Nouvel élève</h2>
      <form id="addStudentForm">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="firstName" placeholder="Ex: Jean" required>
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="lastName" placeholder="Ex: Rakoto" required>
        </div>
        <div class="form-group">
          <label>Matricule</label>
          <input type="text" id="matricule" placeholder="Ex: MAT-2026-001" required>
        </div>
        <div class="form-group">
          <label>Niveau</label>
          <select id="niveau" required>
            <option value="">Sélectionner un niveau</option>
            <option value="6ème">6ème</option>
            <option value="5ème">5ème</option>
            <option value="4ème">4ème</option>
            <option value="3ème">3ème</option>
            <option value="2nde">2nde</option>
            <option value="1ère">1ère</option>
            <option value="Terminale">Terminale</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Enregistrer l'élève</button>
      </form>
    </div>
  </div>

  <!-- Modale Détail -->
  <div id="detailModal" class="modal">
    <div class="modal-dialog">
      <button class="modal-close" id="closeDetailModal">&times;</button>
      <h2 id="detailName" style="margin-bottom:8px;"></h2>
      <p style="color:#64748b; margin-bottom:20px;" id="detailInfo"></p>
      <div class="detail-actions">
        <button class="btn-secondary" id="showHistoryBtn">📋 Historique écolages</button>
        <button class="btn-secondary" id="generateQRBtn">📱 Créer QR Code</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = '/index.html';

    async function apiCall(url, method = 'GET', body = null) {
      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('adminToken');
          window.location.href = '/index.html';
        }
        throw new Error(data.message || 'Erreur');
      }
      return data;
    }

    // Charger les élèves
    async function loadStudents() {
      const tbody = document.querySelector('#studentsTable tbody');
      const msgDiv = document.getElementById('studentsMsg');
      try {
        const students = await apiCall('/api/students');
        tbody.innerHTML = '';
        msgDiv.style.display = 'none';

        if (students.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Aucun élève enregistré pour le moment.</td></tr>`;
          return;
        }

        students.forEach(s => {
          const row = document.createElement('tr');
          const inscriptionDate = s.created_at ? new Date(s.created_at).toLocaleDateString('fr-FR') : '-';
          row.innerHTML = `
            <td><strong>${s.matricule}</strong></td>
            <td>${s.last_name}</td>
            <td>${s.first_name}</td>
            <td><span class="badge-level">${s.niveau || '-'}</span></td>
            <td>${inscriptionDate}</td>
          `;
          row.addEventListener('click', () => openDetail(s));
          tbody.appendChild(row);
        });
      } catch (err) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'msg msg-error';
        msgDiv.textContent = 'Erreur lors du chargement : ' + err.message;
      }
    }

    loadStudents();

    // Modale Ajout
    const addModal = document.getElementById('addModal');
    document.getElementById('openAddModalBtn').addEventListener('click', () => addModal.classList.add('active'));
    document.getElementById('closeAddModal').addEventListener('click', () => addModal.classList.remove('active'));
    window.addEventListener('click', (e) => { if (e.target === addModal) addModal.classList.remove('active'); });

    document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const first_name = document.getElementById('firstName').value.trim();
      const last_name = document.getElementById('lastName').value.trim();
      const matricule = document.getElementById('matricule').value.trim();
      const niveau = document.getElementById('niveau').value;
      const msgDiv = document.getElementById('studentsMsg');

      if (!first_name || !last_name || !matricule || !niveau) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'msg msg-error';
        msgDiv.textContent = 'Tous les champs sont obligatoires.';
        return;
      }

      try {
        await apiCall('/api/students', 'POST', { first_name, last_name, matricule, niveau });
        document.getElementById('addStudentForm').reset();
        addModal.classList.remove('active');
        msgDiv.style.display = 'block';
        msgDiv.className = 'msg msg-success';
        msgDiv.textContent = 'Élève ajouté avec succès !';
        await loadStudents();
        // Masquer le message après 4 secondes
        setTimeout(() => { msgDiv.style.display = 'none'; }, 4000);
      } catch (err) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'msg msg-error';
        msgDiv.textContent = err.message;
      }
    });

    // Modale Détail
    const detailModal = document.getElementById('detailModal');
    let currentStudent = null;

    function openDetail(student) {
      currentStudent = student;
      document.getElementById('detailName').textContent = `${student.first_name} ${student.last_name}`;
      document.getElementById('detailInfo').textContent = `Matricule : ${student.matricule}  •  Niveau : ${student.niveau || '-'}`;
      document.getElementById('detailContent').innerHTML = '';
      detailModal.classList.add('active');
    }

    document.getElementById('closeDetailModal').addEventListener('click', () => detailModal.classList.remove('active'));
    window.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('active'); });

    document.getElementById('showHistoryBtn').addEventListener('click', async () => {
      if (!currentStudent) return;
      const content = document.getElementById('detailContent');
      content.innerHTML = '<p style="color:#64748b;">Chargement...</p>';
      try {
        const history = await apiCall(`/api/student-payments?student_id=${currentStudent.id}`);
        if (history.length === 0) {
          content.innerHTML = '<p style="color:#64748b;">Aucun paiement enregistré.</p>';
          return;
        }
        let html = '<table style="width:100%;margin-top:16px;"><thead><tr><th>Mois</th><th>Montant</th><th>Payé le</th></tr></thead><tbody>';
        history.forEach(p => {
          html += `<tr>
            <td>${p.month}</td>
            <td>${p.amount ? p.amount + ' Ar' : '-'}</td>
            <td>${p.payment_date ? new Date(p.payment_date).toLocaleDateString('fr-FR') : '-'}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<p style="color:#b91c1c;">Erreur : ${err.message}</p>`;
      }
    });

    document.getElementById('generateQRBtn').addEventListener('click', () => {
      if (!currentStudent) return;
      const content = document.getElementById('detailContent');
      const qrData = JSON.stringify({
        matricule: currentStudent.matricule,
        nom: currentStudent.last_name,
        prenom: currentStudent.first_name,
        niveau: currentStudent.niveau
      });
      const qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
      content.innerHTML = `
        <div class="qr-container">
          <img src="${qrURL}" alt="QR Code élève">
          <p style="margin-top:12px; color:#475569;">Scannez ce code pour voir l'identité</p>
        </div>
      `;
    });
  </script>
</body>
</html>
