<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écolages impayés</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .container { width: 100%; max-width: 1100px; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
    }
    .btn-back {
      background: white; border: 1px solid #e2e8f0; padding: 10px 16px;
      border-radius: 12px; font-weight: 500; color: #475569; cursor: pointer;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .btn-back:hover { background: #f8fafc; border-color: #cbd5e1; }
    .card {
      background: white; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      overflow: hidden; padding: 24px;
    }
    .filters {
      display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filters label { font-weight: 600; color: #334155; }
    .filters input[type="month"] {
      padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
      font-size: 0.95rem; outline: none;
    }
    .filters input[type="month"]:focus { border-color: #4f46e5; }
    .btn-load {
      background: #4f46e5; color: white; border: none; padding: 10px 20px;
      border-radius: 10px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-load:hover { background: #4338ca; }
    .table-wrapper { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th {
      background: #f8fafc; font-weight: 600; color: #475569; padding: 16px 20px;
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tbody tr:hover { background: #f8fafc; }
    .badge {
      background: #e0e7ff; color: #4338ca; padding: 4px 12px; border-radius: 20px;
      font-weight: 600; font-size: 0.8rem; display: inline-block;
    }
    .empty-row td { text-align: center; padding: 48px; color: #94a3b8; }
    .msg { margin-top: 16px; padding: 12px 20px; border-radius: 12px; font-weight: 500; }
    .msg-success { background: #dcfce7; color: #166534; }
    .msg-error { background: #fee2e2; color: #991b1b; }
    .btn-pay {
      background: #16a34a; color: white; border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-pay:hover { background: #15803d; }
    .month-cell { color: #b45309; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="btn-back" onclick="window.location.href='/dashboard.html'">← Retour au tableau de bord</button>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 20px;">💰 Écolages impayés</h2>
      <div class="filters">
        <label for="monthPicker">Mois :</label>
        <input type="month" id="monthPicker">
        <button class="btn-load" id="loadUnpaidBtn">🔄 Charger</button>
      </div>

      <div class="table-wrapper">
        <table id="unpaidTable">
          <thead>
            <tr>
              <th>Matricule</th>
              <th>Nom</th>
              <th>Prénom</th>
              <th>Niveau</th>
              <th>Mois impayé</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="unpaidMsg" class="msg" style="display:none;"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = '/index.html';

    async function apiCall(url, method = 'GET', body = null) {
      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('adminToken');
          window.location.href = '/index.html';
        }
        throw new Error(data.message || 'Erreur');
      }
      return data;
    }

    // Initialiser le mois courant
    const now = new Date();
    document.getElementById('monthPicker').value = now.toISOString().slice(0,7);

    // Charger les impayés
    async function loadUnpaid() {
      const month = document.getElementById('monthPicker').value;
      if (!month) return;
      const tbody = document.querySelector('#unpaidTable tbody');
      const msgDiv = document.getElementById('unpaidMsg');
      try {
        const data = await apiCall(`/api/payments?status=unpaid&month=${month}`);
        tbody.innerHTML = '';
        if (data.length === 0) {
          msgDiv.style.display = 'block';
          msgDiv.className = 'msg msg-success';
          msgDiv.textContent = '✅ Tous les élèves ont payé pour ce mois.';
        } else {
          msgDiv.style.display = 'none';
          data.forEach(student => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td><strong>${student.matricule}</strong></td>
              <td>${student.last_name}</td>
              <td>${student.first_name}</td>
              <td><span class="badge">${student.niveau || '-'}</span></td>
              <td class="month-cell">${month}</td>
              <td>
                <button class="btn-pay" data-student-id="${student.id}" data-month="${month}">💰 Marquer payé</button>
              </td>
            `;
            tbody.appendChild(row);
          });

          // Attacher les événements aux boutons "payé"
          document.querySelectorAll('.btn-pay').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const studentId = e.target.dataset.studentId;
              const month = e.target.dataset.month;
              try {
                await apiCall('/api/payments', 'POST', { student_id: studentId, month });
                // Rafraîchir la liste
                loadUnpaid();
              } catch (err) {
                alert('Erreur : ' + err.message);
              }
            });
          });
        }
      } catch (err) {
        msgDiv.style.display = 'block';
        msgDiv.className = 'msg msg-error';
        msgDiv.textContent = 'Erreur : ' + err.message;
      }
    }

    document.getElementById('loadUnpaidBtn').addEventListener('click', loadUnpaid);
    // Charger automatiquement au démarrage
    loadUnpaid();
  </script>
</body>
</html>
