<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Gestion École</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
      padding: 48px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeInUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-container {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: white;
      box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
    }

    .login-card h1 {
      color: #1a202c;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 2rem;
    }

    .login-card p {
      color: #718096;
      margin-bottom: 32px;
      font-size: 1rem;
    }

    .input-group {
      margin-bottom: 24px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .input-group input {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      background: #f7fafc;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      background: #ffffff;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .error-message {
      color: #e53e3e;
      background: rgba(229, 62, 62, 0.08);
      padding: 12px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 0.95rem;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }

    /* Adaptations pour très petits écrans */
    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px;
      }
      .icon-container {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
      .login-card h1 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 360px) {
      .input-group input {
        padding: 14px 14px;
      }
      button {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="icon-container">🔐</div>
    <h1>Espace Admin</h1>
    <p>Gestion des élèves et écolages</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="Entrez l'identifiant" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit">Connexion</button>
      <div class="error-message" id="errorMsg"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = 'Veuillez remplir tous les champs.';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('isLoggedIn', 'true');
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.textContent = data.message || 'Identifiants incorrects.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Erreur réseau. Veuillez réessayer.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
