<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - École</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      background-size: 400% 400%;
      animation: gradientBg 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      font-size: 30px;
      color: white;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .login-container h2 {
      color: #333;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 1.8rem;
    }

    .login-container p {
      color: #777;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      background: #f9f9f9;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      background: #fff;
    }

    .input-group input:read-only {
      background: #f0f0f0;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .error-message {
      color: #d32f2f;
      background: rgba(211, 47, 47, 0.08);
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.9rem;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }

    /* Responsive ajustements */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
      .login-icon {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }
      .login-container h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-icon">🔐</div>
    <h2>Espace Administration</h2>
    <p>Connectez-vous pour gérer l'école</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" value="Andrana" readonly>
      </div>
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required autocomplete="current-password">
      </div>
      <button type="submit">Connexion</button>
      <div class="error-message" id="errorMsg"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';

      // Petite vérification côté client pour éviter les espaces invisibles
      if (password.length === 0) {
        errorDiv.textContent = 'Veuillez entrer un mot de passe.';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username.trim(), password: password.trim() })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Stocker un indicateur de connexion (simple, car pas de JWT pour l'instant)
          localStorage.setItem('isLoggedIn', 'true');
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.textContent = data.message || 'Identifiants incorrects.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Erreur réseau. Veuillez réessayer.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
