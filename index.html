<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 320px; }
    h2 { text-align: center; margin-bottom: 1.5rem; color: #333; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    button { width: 100%; padding: 0.75rem; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.3s; margin-top: 0.5rem; }
    button:hover { background: #5a6fd1; }
    .error { color: #e74c3c; margin-top: 0.75rem; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 Administration</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Nom d'utilisateur" required autocomplete="username">
      <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
      <button type="submit">Connexion</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          // Stocke le token JWT
          localStorage.setItem('adminToken', data.token);
          // Redirection vers le tableau de bord
          window.location.href = '/dashboard.html';
        } else {
          errorMsg.textContent = data.message || 'Identifiants incorrects';
        }
      } catch (err) {
        errorMsg.textContent = 'Erreur réseau';
      }
    });
  </script>
</body>
</html>
